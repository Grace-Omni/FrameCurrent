name: 功能建议 / Feature request
description: 告诉我们你希望改善的创作体验。Suggest an improvement to the creation workflow.
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题 / User problem
      description: 哪一步不顺手，影响了什么使用场景？What is difficult today, and for whom?
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 期待的体验 / Desired outcome
      description: 描述你希望得到的结果。Describe the experience you would like.
    validations:
      required: true
  - type: dropdown
    id: risk
    attributes:
      label: 是否涉及收费生成、密钥或公网使用 / Billing, Keys or public deployment?
      options:
        - 不涉及 / No
        - 涉及 / Yes
        - 不确定 / Unsure
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 如何判断改好了 / Acceptance evidence
      description: 哪个可观察的结果能说明问题解决了？What would prove the improvement works?
