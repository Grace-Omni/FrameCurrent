<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>完整节目 · 连续影像 FrameCurrent</title>
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml">
  <style>
    :root { color-scheme: dark; font-family: Inter, -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif; background: #050605; color: #f3f6f0; --lime: #c8ff62; --line: rgba(255,255,255,.12); --muted: #939c95; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #050605; }
    button, input, a { font: inherit; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #142016, #030403 67%); }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .topbar { position: fixed; z-index: 5; top: 16px; left: 16px; right: 16px; display: flex; justify-content: space-between; align-items: center; pointer-events: none; }
    .back, .status { min-height: 40px; display: flex; align-items: center; gap: 9px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--line); background: rgba(5,7,5,.68); backdrop-filter: blur(14px); color: rgba(255,255,255,.76); text-decoration: none; font-size: 11px; pointer-events: auto; }
    .back b { color: var(--lime); }
    .status i { width: 7px; height: 7px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 9px var(--lime); }
    #cover { position: fixed; z-index: 4; inset: 0; display: grid; place-items: center; padding: 28px; background: radial-gradient(circle at 50% 45%, rgba(24,35,23,.94), rgba(3,4,3,.98) 68%); cursor: pointer; transition: opacity .3s; }
    #cover.hidden { opacity: 0; pointer-events: none; }
    .ready { width: min(460px, 100%); text-align: center; }
    .play-mark { display: block; width: 76px; height: 76px; margin: 0 auto 25px; border-radius: 50%; background: var(--lime); box-shadow: 0 0 75px rgba(200,255,98,.22); position: relative; }
    .play-mark::after { content: ""; position: absolute; left: 32px; top: 25px; border-left: 19px solid #10150e; border-top: 13px solid transparent; border-bottom: 13px solid transparent; }
    h1 { font-size: 27px; margin: 0 0 12px; }
    p { color: var(--muted); line-height: 1.7; font-size: 13px; margin: 0; }
    .loading-track { height: 3px; margin: 25px 0 11px; border-radius: 99px; background: rgba(255,255,255,.08); overflow: hidden; }
    .loading-track i { display: block; width: 18%; height: 100%; background: var(--lime); animation: loading 1.3s infinite ease-in-out; }
    @keyframes loading { 50% { transform: translateX(450%); } }
    #loadText { color: #69716a; font: 10px ui-monospace, monospace; letter-spacing: .12em; }
    .controls { position: fixed; z-index: 6; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(850px, calc(100% - 28px)); display: grid; grid-template-columns: auto 1fr auto auto auto; gap: 12px; align-items: center; padding: 11px 13px; border: 1px solid var(--line); border-radius: 16px; background: rgba(5,7,5,.72); backdrop-filter: blur(15px); opacity: 0; pointer-events: none; transition: opacity .25s; }
    .controls.visible { opacity: 1; pointer-events: auto; }
    .control-button { min-height: 36px; padding: 0 12px; color: rgba(255,255,255,.78); background: rgba(255,255,255,.05); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; }
    #timeline { width: 100%; accent-color: var(--lime); cursor: pointer; }
    #timeText { color: rgba(255,255,255,.58); font: 10px ui-monospace, monospace; white-space: nowrap; }
    .download { min-height: 36px; display: inline-flex; align-items: center; padding: 0 13px; border-radius: 9px; color: #11160e; background: var(--lime); font-size: 11px; font-weight: 800; text-decoration: none; white-space: nowrap; }
    #fatal { position: fixed; z-index: 8; inset: 0; display: none; place-items: center; padding: 35px; background: #090a09; color: #ff8c80; text-align: center; line-height: 1.7; }
    @media (max-width: 660px) {
      .status { display: none; }
      .controls { grid-template-columns: auto 1fr auto; }
      #timeText { display: none; }
      #fullButton { display: none; }
      .download { padding-inline: 10px; }
    }
  </style>
</head>
<body>
  <div id="stage"><video id="movie" playsinline preload="metadata"></video></div>

  <div class="topbar">
    <a class="back" href="/"><b>←</b> 返回连续影像</a>
    <div class="status"><i></i><span>完整作品</span></div>
  </div>

  <div id="cover">
    <div class="ready">
      <i class="play-mark"></i>
      <h1 id="coverTitle">正在准备完整视频</h1>
      <p id="coverCopy">作品准备完成后，点击即可播放。</p>
      <div class="loading-track" id="loadingTrack"><i></i></div>
      <span id="loadText">PREPARING</span>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="control-button" id="playButton" type="button">播放</button>
    <input id="timeline" type="range" min="0" max="1000" value="0" aria-label="播放进度">
    <span id="timeText">00:00 / 00:00</span>
    <button class="control-button" id="fullButton" type="button">全屏</button>
    <a class="download" id="downloadButton" href="#" download>下载 MP4</a>
  </div>

  <div id="fatal"></div>
  <script src="/player.js"></script>
</body>
</html>
